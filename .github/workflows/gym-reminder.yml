name: Gym Reminder

on:
  schedule:
    # 02:00 UTC = 06:00 Asia/Dubai (UTC+4, no DST)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      topic_override:
        description: "Optional: send to this ntfy.sh topic instead of the NTFY_TOPIC secret (useful for test runs)"
        required: false
        type: string

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send workout reminder
        env:
          NTFY_TOPIC: ${{ inputs.topic_override || secrets.NTFY_TOPIC }}
        run: python3 scripts/send_reminder.py

      - name: Verify delivery landed on ntfy.sh (manual test runs only)
        if: ${{ inputs.topic_override != '' }}
        env:
          NTFY_TOPIC: ${{ inputs.topic_override }}
        run: |
          sleep 2
          curl -sS "https://ntfy.sh/${NTFY_TOPIC}/json?poll=1&since=10m" | tee /tmp/ntfy_check.json
          if ! grep -q '"event":"message"' /tmp/ntfy_check.json; then
            echo "No message found on ntfy.sh topic '${NTFY_TOPIC}' - delivery could not be verified." >&2
            exit 1
          fi
          echo "Verified: message is present on ntfy.sh for topic '${NTFY_TOPIC}'."
