name: Database + regression tests (manual)

# Two things "in an environment with Docker" that the sandbox these were
# written in cannot do itself (its network policy allows package registries
# but rejects container registries — see docs/kids-mode/01-decisions.md E-004
# and the completion report for the exact evidence):
#
#   1. supabase test db — pgTAP tests against a real local Postgres.
#   2. A Playwright pass of the Adult Mode regression checklist, against the
#      real app running against that same local Supabase stack. Never
#      production — there is no production credential anywhere in this file.
#
# workflow_dispatch only: pulls ~10 images and runs a full browser suite,
# too heavy for routine push/PR CI. That stays ci.yml's job.

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: forge-saas

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: forge-saas/package-lock.json

      - run: npm ci

      - name: Start local Supabase (Postgres + pgTAP via Docker)
        run: npx supabase start

      # schema.sql is the historical record (17 sections, already applied to
      # production); supabase/migrations/*.sql is everything since Kids Mode
      # Phase 1 — see supabase/migrations/README.md. Neither auto-applies to a
      # bare local stack, so both are applied explicitly, in order, before
      # anything can run against it.
      - name: Apply schema.sql and migrations to the local instance
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/schema.sql
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done

      # A real Supabase project provisions default table-level grants for
      # anon/authenticated/service_role at project creation time — that
      # provisioning lives in Supabase's platform, not in schema.sql, and a
      # bare `supabase start` + schema.sql-only stack never gets it. Proven
      # for real by the first run of this workflow: pgTAP failed with
      # "permission denied for table cycle_settings" even though the RLS
      # policy itself was correct — the role had no table grant to be
      # filtered by RLS in the first place. This step exists ONLY to restore
      # local-test parity with that platform behaviour; schema.sql itself is
      # deliberately left untouched (see docs/kids-mode/01-decisions.md).
      - name: Grant table privileges (mirrors real Supabase project bootstrap)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          grant usage on schema public to anon, authenticated, service_role;
          grant select, insert, update, delete on all tables in schema public to authenticated;
          grant select on all tables in schema public to anon;
          grant all on all tables in schema public to service_role;
          grant usage, select on all sequences in schema public to authenticated, service_role;
          alter default privileges in schema public grant select, insert, update, delete on tables to authenticated;
          alter default privileges in schema public grant select on tables to anon;
          alter default privileges in schema public grant all on tables to service_role;
          SQL

      - name: Run pgTAP tests (RLS ownership)
        run: npx supabase test db

      - name: Read local Supabase connection details
        id: supa
        run: |
          npx supabase status -o env > /tmp/supa.env
          echo "url=$(grep '^API_URL=' /tmp/supa.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "anon_key=$(grep '^ANON_KEY=' /tmp/supa.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$(grep '^SERVICE_ROLE_KEY=' /tmp/supa.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Build the app against the local Supabase instance
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supa.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supa.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supa.outputs.service_role_key }}
          # Not real secrets — throwaway values so build-time module evaluation
          # (web-push's setVapidDetails, called at import time by the cron
          # route) doesn't throw on a missing subject. Nothing here can send a
          # real push notification or authorize a real cron call.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BBHbsWdW8yO2mVv5t5wuW4Zw1lfVljBvTmr6GUwAGXFV4bIe5MkWAlH7yY_UJlaLO8dLWx2SZDR27kDlMT3cI4g
          VAPID_PRIVATE_KEY: CHtvNxqZ7xXknsgg22Ni-RgMGQY7VHwe6j9oqlkUXRI
          VAPID_SUBJECT: mailto:ci-placeholder@example.invalid
          CRON_SECRET: ci-placeholder-not-a-real-secret
          # Throwaway CI value for the parent PIN session JWT (src/lib/kids/pin.ts)
          # — signs tokens for this run only, never a real secret.
          PIN_SESSION_SECRET: ci-placeholder-pin-secret-not-a-real-secret
        run: npm run build

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Start the app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supa.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supa.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supa.outputs.service_role_key }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BBHbsWdW8yO2mVv5t5wuW4Zw1lfVljBvTmr6GUwAGXFV4bIe5MkWAlH7yY_UJlaLO8dLWx2SZDR27kDlMT3cI4g
          VAPID_PRIVATE_KEY: CHtvNxqZ7xXknsgg22Ni-RgMGQY7VHwe6j9oqlkUXRI
          VAPID_SUBJECT: mailto:ci-placeholder@example.invalid
          CRON_SECRET: ci-placeholder-not-a-real-secret
          # Throwaway CI value for the parent PIN session JWT (src/lib/kids/pin.ts)
          # — signs tokens for this run only, never a real secret.
          PIN_SESSION_SECRET: ci-placeholder-pin-secret-not-a-real-secret
        run: npx next start -p 3000 &

      - name: Wait for the app to answer
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Run the Adult Mode regression checklist (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: forge-saas/playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
